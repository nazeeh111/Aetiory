name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Native engine and agent contracts
        run: python -m unittest discover -s tests -v
      - name: Viewer records and controller
        run: |
          node aetiory/web/checks.mjs
          node aetiory/web/controller-checks.mjs
          node aetiory/web/portable-check.mjs aetiory/web/recorded-proof.html
      - name: Build dependency-free wheel
        run: |
          python -m pip install setuptools==84.0.0
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - name: Installed wheel outside checkout
        run: |
          python -m venv --without-pip /tmp/aetiory-installed
          python -m pip --python /tmp/aetiory-installed/bin/python install --no-index --no-deps dist/*.whl
          cd /tmp
          /tmp/aetiory-installed/bin/python -I "$GITHUB_WORKSPACE/scripts/verify_install.py"
