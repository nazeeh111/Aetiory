<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faultsplice return trials</title><style>body{margin:0}.diagram-container{overflow-x:auto}svg{display:block;min-width:1200px}</style><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial" role="img" aria-labelledby="paired-trials-title paired-trials-desc"><title id="paired-trials-title">Faultsplice: a changed failure is not success</title><desc id="paired-trials-desc">Two actual paired return trials retain an original zero-capacity ValueError; replacing zero with None produces a TypeError, while replacing zero with one meets the exact nine-record and 3370 total goal.</desc><rect width="100%" height="100%" fill="#f4f6f8"/>
